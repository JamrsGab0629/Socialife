services:
  database:
    image: postgres:17
    container_name: socialife-database
    environment:
      POSTGRES_DB: socialife
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gabgab0629
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    container_name: socialife-backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: database
      DB_PORT: 5432
    expose:
      - "3000"
    depends_on:
      - database

  frontend:
    build:
      context: ./Frontend
    container_name: socialife-frontend
    expose:
      - "80"

  nginx:
    build:
      context: ./nginx
    container_name: socialife-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data: