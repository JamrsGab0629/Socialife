<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socialife - Settings</title>

    <link rel="stylesheet" href="../css/animation.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/skeleton.css">
    <link rel="stylesheet" href="../css/topbar-search.css">
    <link rel="stylesheet" href="../css/settings.css">
    <link rel="stylesheet" href="../css/settings-status.css">
    <link rel="stylesheet" href="../css/media/skeleton.css">
    <link rel="stylesheet" href="css/settings.css">
</head>

<body>

    <!-- Reusable Nav Components -->
    <socialife-sidebar active="settings" user-name="James Gabriel Santos"></socialife-sidebar>
    <socialife-mobile-nav active="settings"></socialife-mobile-nav>

    <!-- Main Content -->
    <main id="main-content">
        <div id="settings">
            <div class="settings-body">

                <div class="section-heading">Account Settings</div>
                <div class="settings-card">
                    <settings-item icon="../images/icon/user-avatar.png" title="Edit Profile" desc="Name, bio, profile picture, cover photo" action="edit-profile"></settings-item>
                    <settings-item icon="../images/icon/lock.png" title="Change Password" desc="Update your account password" action="change-password"></settings-item>
                    <settings-item icon="../images/icon/email.png" title="Email / Username" desc="Update your contact information" action="update-email"></settings-item>
                    <settings-item icon="../images/icon/privacy.png" title="Privacy" desc="Public profile vs. Private" action="privacy"></settings-item>
                </div>

                <div class="section-heading">Preferences</div>
                <div class="section-sub">Customize your experience on Socialife.</div>
                <div class="settings-card">
                    <settings-item icon="../images/icon/bell.png" title="Notifications" desc="Manage notification preferences" action="notifications"></settings-item>
                    <settings-item icon="../images/icon/contrast.png" title="Dark mode" desc="Switch to a darker theme" type="toggle" toggle-id="darkModeToggle"></settings-item>
                </div>

                <div class="section-heading">Account Management</div>
                <div class="settings-card">
                    <settings-item icon="../images/icon/delete.png" title="Delete Account" desc="Permanently delete your account" action="delete-account" danger></settings-item>
                    <settings-item icon="../images/icon/logout.png" title="Logout" desc="Sign out of your account" action="logout" danger></settings-item>
                </div>

                <!-- Reusable Toast Notification Component -->
                <status-toast id="toast"></status-toast>

            </div>
        </div>
    </main>

    <!-- Load Component Definitions -->
    <script src="../js/components/socialife-sidebar.js"></script>
    <script src="../js/components/socialife-mobile-nav.js"></script>
    <script src="../js/components/settings-item.js"></script>
    <script src="../js/components/status-toast.js"></script>
    
    <!-- Page Logic -->
    <script src="../js/settings.js"></script>
</body>

</html>
