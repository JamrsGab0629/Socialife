<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>socialife — post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="viewer" id="viewer">

  <section class="photo-stage">
    <button class="stage-btn close-btn" id="closeBtn" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
      </svg>
    </button>

    <button class="stage-btn nav-btn nav-prev" id="prevBtn" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none">
        <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>

    <div class="photo-frame">
      <img class="stage-photo active" src="../../../GUI/images/post/Dave.jpg" alt="" data-index="0">
      <img class="stage-photo" src="../../../GUI/images/post/Lee.jpg" alt="" data-index="1">
    </div>

    <button class="stage-btn nav-btn nav-next" id="nextBtn" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none">
        <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>

    <div class="photo-dots" id="photoDots">
      <button class="photo-dot active" type="button" data-index="0"></button>
      <button class="photo-dot" type="button" data-index="1"></button>
    </div>
  </section>

  <section class="post-panel">

    <div class="panel-top">
      <span class="panel-brand">socialife</span>
      <div class="viewer-avatar">
        <img src="../../../GUI/images/profile/James.jpg" alt="James Gabriel Santos">
      </div>
    </div>

    <div class="post-header">
      <div class="author-avatar">
        <img src="../../../GUI/images/profile/James.jpg" alt="James Gabriel Santos">
      </div>
      <div class="author-meta">
        <span class="author-name">James Gabriel Santos</span>
        <div class="post-sub">
          <span class="privacy-pill">
            <svg class="icon" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"></circle>
              <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z" stroke="currentColor" stroke-width="1.8"></path>
            </svg>
            <span>Public</span>
          </span>
          <span class="post-time">2d</span>
        </div>
      </div>
    </div>

    <p class="post-caption">Hahahaha dump kolang</p>

    <div class="reaction-bar">
      <button class="like-btn" id="likeBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 20s-7-4.4-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 5c-2.5 4.6-9.5 9-9.5 9z" stroke="currentColor" stroke-width="1.6"></path>
        </svg>
        <span id="likeCount">1,300</span>
      </button>
      <div class="reaction-stat">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M4 5h16v11H8l-4 4V5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
        </svg>
        <span id="commentCount">2</span>
      </div>
      <div class="reaction-stat">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span>62</span>
      </div>
    </div>

    <div class="panel-divider"></div>

    <div class="comment-list" id="commentList">

      <div class="comment-item">
        <div class="comment-avatar">
          <img src="../../../GUI/images/profile/Xep.jpg" alt="Xep">
        </div>
        <div class="comment-body">
          <div class="comment-bubble">
            <span class="comment-name">Xep Lucas</span>
            <p class="comment-text">Angas erp</p>
          </div>
          <div class="comment-actions">
            <button type="button" class="comment-like">Like</button>
            <button type="button">Reply</button>
            <span class="comment-time">1d</span>
          </div>
        </div>
      </div>

      <div class="comment-item">
        <div class="comment-avatar">
          <img src="../../../GUI/images/profile/dave.png" alt="dave">
        </div>
        <div class="comment-body">
          <div class="comment-bubble">
            <span class="comment-name">Dave Darryl Lebico</span>
            <p class="comment-text">Ganda ng lighting pre</p>
          </div>
          <div class="comment-actions">
            <button type="button" class="comment-like">Like</button>
            <button type="button">Reply</button>
            <span class="comment-time">2d</span>
          </div>
        </div>
      </div>

    </div>

    <div class="comment-composer">
      <div class="viewer-avatar small">
        <img src="../../../GUI/images/profile/James.jpg" alt="James Gabriel Santos">
      </div>
      <div class="comment-input-wrap">
        <input type="text" class="comment-input" id="commentInput" placeholder="Write a comment...">
        <button class="comment-send" id="commentSend" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path d="M4 20l16-8L4 4v6l10 2-10 2v6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </div>

  </section>

</div>

<script src="script.js"></script>
</body>
</html>
