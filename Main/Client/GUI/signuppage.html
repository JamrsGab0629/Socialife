<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="signup.css">
</head>
<body>

<div class="signup-card">

    <div class="logo">
        LOGO
    </div>

    <form>

        <label>Username:</label>
        <input type="text" placeholder="Enter your username">

        <label>Password:</label>
        <input type="password" placeholder="Enter your password">

        <label>Confirm Password:</label>
        <div class="password-box">
            <input type="password" placeholder="Reenter your password">
            <i class="fa-solid fa-eye"></i>
        </div>

        <label>Gmail Address:</label>
        <input type="email" placeholder="Enter your gmail address">

        <div class="login-link">
            <a href="#">Already have an account?</a>
        </div>

        <button type="submit">SIGN UP!</button>

    </form>

</div>

<script>
const eye = document.querySelector(".password-box i");
const password = document.querySelector(".password-box input");

eye.addEventListener("click", () => {
    if (password.type === "password") {
        password.type = "text";
        eye.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        password.type = "password";
        eye.classList.replace("fa-eye-slash", "fa-eye");
    }
});
</script>

</body>
</html>
