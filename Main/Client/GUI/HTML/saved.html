<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Socialife - Messages</title>

    <!-- skeleton -->
    <link rel="stylesheet" href="../css/animation.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/skeleton.css">

    <!-- feed -->
    <link rel="stylesheet" href="../css/feed.css">

    <!-- saved -->
    <link rel="stylesheet" href="../css/saved.css">

    <!-- media -->
    <link rel="stylesheet" href="../css/media/skeleton.css">
    <link rel="stylesheet" href="../css/media/saved.css">
</head>

<body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <a id="refresh" href="home.html" class="logo">
            <img id="main-logo" class="stamp" src="../images/Socialife-stamp.png" alt="Socialife-stamp">
            <img class="script" src="../images/Socialife-script.png" alt="Socialife-script">
        </a>

        <a nav-action="profile" id="profile-nav" href="profile.html">
            <div class="profile-block">
                <div class="avatar-ring"><img src="../images/profile/James.jpg" alt="James Gabriel Santos"></div>
                <div class="profile-name">James Gabriel Santos</div>
            </div>
        </a>

        <nav class="nav">
            <a nav-action="home" class="nav-item" href="home.html">
                <img class="simple-icon" src="../images/icon/home.png">
                Home
            </a>
            <a nav-action="saved" class="nav-item" href="saved.html">
                <img class="simple-icon" src="../images/icon/save.png">
                Saved
            </a>
            <a nav-action="friends" class="nav-item" href="profile.html">
                <img class="simple-icon" src="../images/icon/group.png">
                Friends
            </a>
            <a nav-action="settings" class="nav-item" href="settings.html">
                <img class="simple-icon" src="../images/icon/settings.png">
                Settings
            </a>
            <a nav-action="log-out" class="nav-item" href="#">
                <img class="simple-icon" src="../images/icon/logout.png">
                Log Out
            </a>
        </nav>
    </aside>

    <!-- MOBILE BOTTOM NAV -->
    <nav class="mobile-bottom-nav">
        <a nav-action="home" class="mobile-nav-item" href="home.html">
            <img class="simple-icon" src="../images/icon/home.png">
            Home
        </a>
        <a nav-action="saved" class="mobile-nav-item" href="saved.html">
            <img class="simple-icon" src="../images/icon/save.png">
            Saved
        </a>
        <a nav-action="friends" class="mobile-nav-item" href="freinds.html">
            <img class="simple-icon" src="../images/icon/group.png">
            Friends
        </a>
        <a nav-action="settings" class="mobile-nav-item" href="settings.html">
            <img class="simple-icon" src="../images/icon/settings.png">
            Settings
        </a>
        <a nav-action="log-out" class="mobile-nav-item" href="#">
            <img class="simple-icon" src="../images/icon/logout.png">
            Log Out
        </a>
    </nav>

    <main id="main-content">
        <div id="saved">
            <div class="saved-header">
                <h2>Saved</h2>
                <div class="saved-count">Saved posts (2)</div>
            </div>

            <div class="feed">
                <div class="post-card">
                    <div class="post-header">
                        <img src="../images/profile/dave.png" alt="Dave Profile" class="profile-img">
                        <h2>
                            <div class="post-author">Dave Darryl Lebico</div>
                            <div class="post-time">Saved yesterday</div>
                        </h2>
                        <a class="action-more" href="#"><img src="../images/icon/more.png" alt="more"></a>
                    </div>
                    <div class="post-text">Pack ohh meme vice ang dating.</div>
                    <div class="post-photo">
                        <img src="../images/post/dave.jpg" alt="Saved Post Content" class="post-photo">
                    </div>
                </div>

                <div class="post-card">
                    <div class="post-header">
                        <img src="../images/profile/lee.jpg" alt="Lee Profile" class="profile-img">
                        <h2>
                            <div class="post-author">Lee James Benigno</div>
                            <div class="post-time">Saved 3 days ago</div>
                        </h2>
                        <a class="action-more" href="#"><img src="../images/icon/more.png" alt="more"></a>
                    </div>
                    <div class="post-text">Dave mah loves.</div>
                    <div class="post-photo">
                        <img src="../images/post/lee.jpg" alt="Saved Post Content" class="post-photo">
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
