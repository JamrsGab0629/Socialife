<aside class="mess-conv">
    <div class="conv-list-header">
        <div class="conv-list-title">Messages</div>
        <div class="conv-search">
            <img src="./images/icon/search.png" alt="">
            <input type="text" placeholder="Search Messenger" />
        </div>
    </div>

    <div class="conv-item active" onclick="selectConversation(this, 'Andrei Luis Lucas', 'Active now')">
        <a id="andrei" href="#">
            <div class="conv-avatar">
                <img src="./images/profile/Xep.jpg" alt="Xep">
            </div>
            <div class="conv-info">
                <div class="conv-name-row">
                    <span class="conv-name">Andrei Luis Lucas</span>
                    <span class="conv-time">2m</span>
                </div>
                <div class="conv-preview">Get it out! 😂</div>
            </div>
        </a>
    </div>

    <div class="conv-item unread" onclick="selectConversation(this, 'Dave Lebico', 'Active 5m ago')">
        <a href="#">
            <div class="conv-avatar">
                <img src="./images/profile/dave.png" alt="Dave Lebico">
            </div>
            <div class="conv-info">
                <div class="conv-name-row">
                    <span class="conv-name">Dave Lebico</span>
                    <span class="conv-time">18m</span>
                </div>
                <div class="conv-preview">Are we still on for coffee tomorrow?</div>
            </div>
            <span class="conv-unread-dot"></span>
        </a>
    </div>

    <div class="conv-item" onclick="selectConversation(this, 'Lee Benigno', 'Active 1h ago')">
        <a href="#">
            <div class="conv-avatar">
                <img src="./images/profile/Lee.jpg" alt="Lee Benigno">
            </div>
            <div class="conv-info">
                <div class="conv-name-row">
                    <span class="conv-name">Lee benigno</span>
                    <span class="conv-time">1h</span>
                </div>
                <div class="conv-preview">Court's booked for Saturday morning</div>
            </div>
        </a>
    </div>

    <div class="conv-item" onclick="selectConversation(this, 'Philip', 'Active 3h ago')">
        <a href="#">
            <div class="conv-avatar">
                <img src="./images/profile/Philip.jpg" alt="Philip">
            </div>
            <div class="conv-info">
                <div class="conv-name-row">
                    <span class="conv-name">Philip</span>
                    <span class="conv-time">5h</span>
                </div>

            </div>
        </a>
    </div>

    <div class="conv-item" onclick="selectConversation(this, 'Micheal Cadayona', 'Active yesterday')">
        <a href="#">
            <div class="conv-avatar">
                <img src="./images/profile/Mike.jpg" alt="Micheal Cadayona">

                <div class="conv-name-row">
