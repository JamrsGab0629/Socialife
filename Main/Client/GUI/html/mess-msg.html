<main class="mess-msg">
    <div class="chat-header">
        <div class="chat-header-avatar" id="chatHeaderAvatar">
            <img src="./images/profile/Xep.jpg" alt="Xep">
        </div>
        <div>
            <div class="chat-header-name" id="chatHeaderName">Andrei Luis Lucas</div>
            <div class="chat-header-status" id="chatHeaderStatus">Active now</div>
        </div>
    </div>

    <div class="messages-area" id="messagesArea">
        <div class="trail-divider">
            <svg width="14" height="12" viewBox="0 0 24 20" fill="none">
                <path d="M2 18L9 6l4 6 3-4 6 10" stroke="#B7BFC8" stroke-width="1.8" stroke-linejoin="round"
                    stroke-linecap="round" />
            </svg>
            Today, 2:14 PM
        </div>

        <div class="msg-row received">
            <div class="msg-row-avatar">
                <img src="./images/profile/Xep.jpg" alt="Xep">
            </div>
            <div class="msg-bubble" ondblclick="reactToMessage(this)">bro nice hike pics</div>
        </div>

        <div class="msg-row received">
            <div class="msg-row-avatar">
                <img src="./images/profile/Xep.jpg" alt="Xep">
            </div>
            <div class="msg-bubble" ondblclick="reactToMessage(this)">i'm a great hike!</div>
        </div>

        <div class="msg-row sent">
            <div class="msg-bubble" ondblclick="reactToMessage(this)">lol get it out</div>
        </div>

        <div class="msg-row sent">
            <div class="msg-bubble" ondblclick="reactToMessage(this)">how far up did you go?</div>
        </div>

        <div class="msg-row received">
            <div class="msg-row-avatar">
                <img src="./images/profile/Xep.jpg" alt="Xep">
            </div>
            <div class="msg-bubble" ondblclick="reactToMessage(this)">Get it out! 😂</div>
        </div>
    </div>

    <div class="chat-input-bar">
        <input type="text" id="chatInput" class="chat-input" placeholder="Aa" onkeydown="handleChatInputKey(event)">
        <button class="send-btn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" />
            </svg>
        </button>
    </div>
</main>
