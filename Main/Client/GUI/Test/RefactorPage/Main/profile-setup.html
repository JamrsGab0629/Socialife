  <!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socialife — Complete Your Profile</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/profile.css">
  </head>
  <body class="auth-body">

  <div class="auth-shell">

    <aside class="auth-brand">
      <a href="landing.html" class="auth-brand-logo">
        <span class="nav-logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="24" height="24"><path d="M2 20c4-8 8-8 12 0s8 8 12 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        Socialife
      </a>

      <div class="auth-brand-copy">
        <h1>Almost there — let's set up your profile.</h1>
        <p>A few details so your profile feels like you before you start following your Friends and Families.</p>
      </div>

      <div class="auth-brand-wave" aria-hidden="true">
        <svg viewBox="0 0 400 120" preserveAspectRatio="none">
          <path d="M0 60 C 50 20, 100 100, 150 60 S 250 20, 300 60 S 380 90 400 60" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M0 80 C 50 40, 100 120, 150 80 S 250 40, 300 80 S 380 110 400 80" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>
        </svg>
      </div>

      <blockquote class="auth-quote">
        "The details you share is Private and Secure"
        <cite>— Socialife Privacy</cite>
      </blockquote>
    </aside>

    <main class="auth-panel">
      <div class="auth-card profile-card">

        <h2 class="otp-title">Complete your profile</h2>
        <p class="otp-sub">Step 2</p>

        <form class="auth-form" id="profileForm" novalidate>

          <div class="profile-name-grid">
            <label class="auth-field">
              <span>First Name</span>
              <input type="text" name="firstName" autocomplete="given-name" required placeholder="Juan">
            </label>

            <label class="auth-field">
              <span>Middle Name</span>
              <input type="text" name="middleName" autocomplete="additional-name" placeholder="Dela">
            </label>
          </div>

          <label class="auth-field">
            <span>Last Name</span>
            <input type="text" name="lastName" autocomplete="family-name" required placeholder="Cruz">
          </label>

          <label class="auth-field">
            <span>Birthdate</span>
            <input type="date" name="birthdate" id="birthdate" required>
          </label>

          <label class="auth-field">
            <span>Address</span>
            <input type="text" name="address" autocomplete="street-address" required placeholder="Balagtas, Bulacan, Philippines">
          </label>

          <button type="submit" class="btn btn-primary auth-submit">Complete Profile</button>

        </form>

      </div>
    </main>
  </div>

  <script src="Js/profile.js"></script>
  </body>
  </html>
