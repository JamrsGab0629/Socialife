<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socialife — Sign Up</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body">

    <div class="auth-shell">

        <aside class="auth-brand">
            <a href="landing.html" class="auth-brand-logo">
                <span class="nav-logo-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" width="24" height="24">
                        <path d="M2 20c4-8 8-8 12 0s8 8 12 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                    </svg>
                    </span>
                    Socialife
                    </a>

            <div class="auth-brand-copy">
                <h1>Your feed, tuned to your frequency.</h1>
                <p>Join a platform built to surface what matters to you — not whatever keeps you scrolling the longest.
                </p>
                </div>

            <div class="auth-brand-wave" aria-hidden="true">
                <svg viewBox="0 0 400 120" preserveAspectRatio="none">
                    <path d="M0 60 C 50 20, 100 100, 150 60 S 250 20, 300 60 S 380 90 400 60" fill="none" stroke="currentColor"
                        stroke-width="2" />
                    <path d="M0 80 C 50 40, 100 120, 150 80 S 250 40, 300 80 S 380 110 400 80" fill="none" stroke="currentColor"
                        stroke-width="2" opacity="0.5" />
                    </svg>
                    </div>

            <blockquote class="auth-quote">
                "Finally a feed that feels curated by me, not for me."
                <cite>— Early Socialife member</cite>
            </blockquote>
            </aside>

        <main class="auth-panel">
            <div class="auth-card">

                <div class="auth-tabs" role="tablist">
                    <a href="login.html" class="auth-tab" role="tab" aria-selected="false">Log In</a>
                    <a href="signup.html" class="auth-tab is-active" role="tab" aria-selected="true">Sign Up</a>
                    <span class="auth-tab-indicator is-signup" aria-hidden="true"></span>
                </div>

                <form class="auth-form" id="signupForm" novalidate>
                    <button type="button" class="btn btn-google">
                        <svg width="18" height="18" viewBox="0 0 18 18">
                            <path fill="#4285F4"
                                d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.61z" />
                            <path fill="#34A853"
                                d="M9 18c2.43 0 4.47-.8 5.96-2.19l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.98v2.33A9 9 0 0 0 9 18z" />
                            <path fill="#FBBC05" d="M3.97 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.98a9 9 0 0 0 0 8.08z" />
                            <path fill="#EA4335"
                                d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.96l2.99 2.33C4.68 5.16 6.66 3.58 9 3.58z" />
                        </svg>
                        Continue with Google
                        </button>

                    <div class="auth-divider"><span>OR</span></div>

                    <label class="auth-field">
                        <span>Full Name</span>
                        <input type="text" name="fullname" autocomplete="name" required placeholder="Juan Dela Cruz">
                    </label>

                    <label class="auth-field">
                        <span>Email Address</span>
                        <input type="email" name="email" autocomplete="email" required placeholder="you@email.com">
                    </label>

                    <label class="auth-field">
                        <span>Password</span>
                        <div class="auth-password-wrap">
                            <input type="password" name="password" id="signupPassword" autocomplete="new-password" required
                                placeholder="Create a password">
                            <button type="button" class="pw-toggle" data-target="signupPassword" aria-label="Show password">Show</button>
                            </div>
                            <div class="pw-strength" id="pwStrength" aria-hidden="true">
                                <div class="pw-strength-bar"><span></span></div>
                                <span class="pw-strength-label">Weak</span>
                            </div>
                            </label>

                    <label class="auth-checkbox auth-terms">
                        <input type="checkbox" name="terms" required>
                        <span>I agree to the <a href="#" class="auth-link">Terms &amp; Conditions</a> and <a href="#" class="auth-link">Privacy
                                Policy</a></span>
                        </label>

                    <button type="submit" class="btn btn-primary auth-submit">Create Account</button>

                    <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
                    </form>

            </div>
            </main>
            </div>

    <script src="Js/signup.js">
    </script>
    </body>

</html>
