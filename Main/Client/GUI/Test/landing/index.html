<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socialife - About Us</title>
  
  <!-- External stylesheet linking -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Responsive SVG Wave Clipper definition -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <clipPath id="organic-wave-clip" clipPathUnits="objectBoundingBox">
        <path d="M 0.55 0 
                 C 0.43 0.15, 0.40 0.32, 0.48 0.45 
                 C 0.60 0.58, 0.68 0.72, 0.52 0.90 
                 C 0.48 0.94, 0.53 0.98, 0.55 1 
                 L 1 1 L 1 0 Z" />
      </clipPath>
    </defs>
  </svg>

  
  <div class="bg-wave-container">
    <div class="bg-wave-graphic"></div>
  </div>

 
  <div class="hero-viewport-wrapper">
    
    
    <header class="main-header">
      
      <a href="#" class="brand-logo-link">
        <img src="../../images/Socialife-script.png" alt="Socialife Logo" class="logo-img-asset">
      </a>
      <nav class="header-auth-links">
        <a href="#login" class="login-link">Log In</a>
        <a href="#signin" class="signin-btn">Sign In</a>
      </nav>
    </header>

   
    <main class="hero-container">
      
     
      <section class="content-left-column">
        <h1 class="about-title">About Us</h1>
        <p class="about-description">
          Connect with your circle through posts and comments because true interaction 
          happens out in the open, no private messaging clutter required!
        </p>
        
        
        <div class="about-illustration-wrapper">
          <img src="../../images/globe.png" alt="Diverse people standing around the globe holding hands" class="spinning-globe-graphic">
        </div>
      </section>

     
      <section class="visual-right-column">
        
        
        <img src="../../images/design-landing.svg" alt="Layered Paper Graphic" class="custom-paper-image-backdrop">

       
        <div class="ui-feed-card-component">
          <div class="feed-user-header">
            <div class="feed-avatar-placeholder"></div>
            <div class="feed-meta-skeleton">
              <div class="skeleton-line-md"></div>
              <div class="skeleton-line-sm"></div>
            </div>
          </div>
          <div class="feed-body-content">
            <div class="skeleton-body-line"></div>
            <div class="skeleton-body-line"></div>
            <div class="skeleton-body-line short"></div>
          </div>
          <div class="feed-interaction-footer">
            <div class="action-utility-icon-arrow"></div>
          </div>
        </div>

        
        <div class="floating-comment-badge">
          <div class="badge-avatar-xs"></div>
          <div class="badge-line-xs"></div>
        </div>
      </section>

    </main>
  </div>

</body>
</html>
