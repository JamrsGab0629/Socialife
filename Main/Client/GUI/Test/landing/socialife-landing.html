<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socialife</title>
<style>
  :root {
    --blue-primary: #4A5FE8;
    --blue-dark: #2F43C2;
    --blue-light: #F0F3FF;
    --blue-glow: rgba(74, 95, 232, 0.4);
    --white: #ffffff;
    --text-dark: #12121F;
    --text-muted: #5C6275;
    --aqua: #00E5FF;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Helvetica, "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    color: var(--text-dark);
    background: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    z-index: 1;
  }

  /* --- VISUAL DECORATIONS & BLOBS --- */
  .glow-blob {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(74, 95, 232, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
    top: -100px;
    left: -100px;
    z-index: 1;
    pointer-events: none;
  }

  /* --- WAVE BACKGROUND --- */
  .wave-bg {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 65%;
    z-index: 1;
    pointer-events: none;
  }

  .wave-bg svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* --- HEADER & NAVIGATION --- */
  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2.5rem 4rem;
    width: 100%;
    flex-wrap: nowrap; /* Prevents header items from wrapping awkwardly on heavy zoom */
  }

  .logo-link {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    transition: transform 0.2s ease;
    z-index: 12;
    padding-left: 1rem;
  }

  .logo-link:hover {
    transform: translateY(-1px);
  }

  .logo-img {
    height: 5.5rem; 
    width: auto;
    object-fit: contain;
    transform: scale(1.3); 
    transform-origin: left center;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 2.5rem;
    flex-shrink: 0; /* Keeps navigation items structured together */
  }

  /* Locked strictly to white for high contrast over the wave graphic */
  .nav-links a.zoom-safe-link {
    text-decoration: none;
    color: var(--white) !important;
    font-size: 1rem;
    font-weight: 600;
    position: relative;
    z-index: 12;
    padding: 0.25rem 0;
    white-space: nowrap; /* Stops "Log In" from breaking into two lines */
    transition: opacity 0.3s ease;
  }

  /* White underline slide effect */
  .nav-links a.zoom-safe-link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: var(--white);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.3s ease;
  }

  .nav-links a.zoom-safe-link:hover::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  .nav-links a.zoom-safe-link:hover {
    opacity: 0.9;
  }

  /* Sign In Button */
  .nav-links a.signin-btn {
    background: var(--white);
    color: var(--blue-primary);
    padding: 0.75rem 1.75rem;
    border-radius: 12px;
    font-weight: 600;
    text-decoration: none;
    position: relative;
    z-index: 12;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    white-space: nowrap;
  }

  .nav-links a.signin-btn:hover {
    background: var(--blue-light);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
  }

  /* --- MAIN HERO SECTION --- */
  main {
    position: relative;
    z-index: 5;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2rem 4rem;
    gap: 4rem;
  }

  .content {
    max-width: 32rem;
    width: 100%;
    animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .content h1 {
    font-size: 4.5rem;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.04em;
    color: var(--text-dark);
    margin-bottom: 1.5rem;
  }

  .content p {
    font-size: 1.1rem;
    color: var(--text-muted);
    line-height: 1.8;
  }

  /* --- HERO VISUAL GRAPHICS CONTAINER --- */
  .hero-visual {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    height: 100%;
    min-height: 450px;
  }

  /* FIXED: Added clean responsive image styling to shrink it down */
  .landing-illustration {
    width: 100%;
    max-width: 700px; /* Reduced to make it compact and clean */
    height: auto;
    object-fit: contain;
    margin-left: auto; /* Pushes it nicely toward the right side wave */
    animation: floatIllustration 6s ease-in-out infinite;
  }

  /* --- ANIMATIONS --- */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes floatIllustration {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }

  /* --- RESPONSIVE STYLING (MOBILE & ZOOM SUPPORT) --- */
  @media (max-width: 992px) {
    .nav-links a.zoom-safe-link {
      color: var(--white) !important;
    }
    .nav-links a.zoom-safe-link::after {
      background-color: var(--white);
    }
  }

  @media (max-width: 768px) {
    header {
      padding: 1.5rem 2rem;
    }

    .wave-bg {
      width: 100%;
      height: 48%;
      top: 0;
      left: 0;
    }

    .wave-bg svg {
      transform: rotate(180deg);
    }

    .logo-img {
      filter: none;
    }

    .nav-links a.zoom-safe-link {
      color: var(--white) !important;
    }

    .nav-links a.zoom-safe-link::after {
      background-color: var(--white);
    }

    .nav-links a.signin-btn {
      background: var(--white);
      color: var(--blue-primary);
    }

    main {
      padding: 4rem 2rem 2rem 2rem;
      flex-direction: column-reverse;
      justify-content: flex-start;
      min-height: calc(100vh - 80px);
      gap: 3rem;
    }

    .hero-visual {
      min-height: auto;
      height: 320px;
      width: 100%;
    }

    .landing-illustration {
      margin-left: auto;
      margin-right: auto;
    }

    .content {
      max-width: 100%;
      text-align: center;
    }

    .content h1 {
      font-size: 3rem;
    }
  }

  @media (max-width: 480px) {
    header {
      padding: 1.25rem 1.25rem;
    }

    .nav-links {
      gap: 1.25rem;
    }

    main {
      padding: 2rem 1.25rem 2rem 1.25rem;
    }

    .content h1 {
      font-size: 2.5rem;
    }
    
    .hero-visual {
      transform: scale(0.9);
    }
    /* Keep the logo sharp and readable on mobile */
.logo-link img {
    width: 100px;       /* Set a fixed, crisp width for mobile */
    height: auto;       /* Maintains the aspect ratio so it doesn't distort */
    max-width: 30vw;    /* Ensures it never takes up more than 40% of the screen width */
    object-fit: contain;
}
  }
</style>
</head>
<body>

<div class="page">
  <!-- Glowing subtle visual blob behind text -->
  <div class="glow-blob"></div>

  <!-- Blue Wave Background Graphic -->
  <div class="wave-bg">
    <svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <path fill="#4A5FE8" d="M310,0
        C420,90 200,190 300,290
        C400,390 550,340 480,460
        C410,580 250,560 320,680
        C360,750 340,780 310,800
        L800,800 L800,0 Z" />
    </svg>
  </div>

  <header>
    <a href="#" class="logo-link">
      <img src="../../images/Socialife-script.png" alt="Socialife Logo" class="logo-img">
    </a>
    
    <nav class="nav-links">
      <a href="#login" class="zoom-safe-link">Log In</a>
      <a href="#signin" class="signin-btn">Sign In</a>
    </nav>
  </header>

  <main>
    <!-- Left Hand Typography Content -->
    <div class="content">
      <h1>About Us</h1>
      <p>
        Connect with your circle through posts and comments because true interaction 
        happens out in the open, no private messaging clutter required!
      </p>
    </div>

    <!-- Right Hand Vector Graphic Illustration Container -->
    <div class="hero-visual">
      <img src="../../images/design-landing.svg" alt="Socialife Connection Illustration" class="landing-illustration">
    </div>
  </main>
</div>

</body>
</html>
