<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/login-signup.css">
</head>

<body class="login-signup">
    <main class="signup-card">
        <script type="module" src="./js/signup.js"></script>

        <div class="logo">
            <img width="80px" height="80px" src="./images/Socialife-stamp.png" alt="Socialife-Stamp">
            <img width="160px" height="80px" class="logo" src="./images/Socialife-script.png" alt="Socialife-Script">
        </div>

        <form class="body">
            <div class="label-input">
                <label>Name:</label>
                <input id="name-input" type="text" placeholder="Enter your name">
            </div>

            <div class="label-input">
                <label>Username:</label>
                <input id="username-input" type="text" placeholder="Enter your username">
            </div>

            <div class="label-input">
                <label>Email:</label>
                <input id="email-input" type="email" placeholder="Enter your email address">
            </div>

            <div class="label-input">
                <label>Password:</label>
                <div id="password" class="password-box">
                    <input id="password-input" type="password" placeholder="Enter your password">
                    <i class="fa-solid fa-eye-slash"></i>
                </div>
            </div>

            <div class="label-input">
                <label>Confirm Password:</label>
                <div id="confirm-password" class="password-box">
                    <input id="confirm-password-input" type="password" placeholder="Reenter your password">
                    <i class="fa-solid fa-eye-slash"></i>
                </div>
            </div>
        </form>

        <div class="action">
            <a href="login.html" id="login-signup">Already have an account?</a>

            <button type="submit" id="signup-button">SIGN UP!</button>
        </div>
    </main>

    <script>
        const password_eye = document.querySelector("#password i");
        const password = document.querySelector("#password input");

        const confirm_password_eye = document.querySelector("#confirm-password i");
        const confirm_password = document.querySelector("#confirm-password input");

        password_eye.addEventListener("click", () => {
            if (password.type === "password") {
                password.type = "text";
                password_eye.classList.replace("fa-eye-slash", "fa-eye");

            } else {
                password.type = "password";
                password_eye.classList.replace("fa-eye", "fa-eye-slash");
            }
        });

        confirm_password_eye.addEventListener("click", () => {
            if (confirm_password.type === "password") {
                confirm_password.type = "text";
                confirm_password_eye.classList.replace("fa-eye-slash", "fa-eye");

            } else {
                confirm_password.type = "password";
                confirm_password_eye.classList.replace("fa-eye", "fa-eye-slash");
            }
        });
    </script>

</body>

</html>
