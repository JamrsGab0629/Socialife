<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadows -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <filter id="pop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#4A5FE8" flood-opacity="0.25" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FE8" />
      <stop offset="100%" stop-color="#2F43C2" />
    </linearGradient>
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
  </defs>

  <!-- Background Glow Element -->
  <circle cx="250" cy="250" r="180" fill="url(#blueGrad)" opacity="0.15" filter="blur(40px)" />

  <!-- Main "Post" Feed Card (Slightly tilted for style) -->
  <g filter="url(#drop-shadow)" transform="rotate(-3, 250, 250)">
    <!-- White Card Base -->
    <rect x="100" y="110" width="300" height="280" rx="24" fill="#FFFFFF" />
    
    <!-- User Profile Header -->
    <circle cx="145" cy="160" r="20" fill="url(#blueGrad)" />
    <!-- Mini user name/date details -->
    <rect x="175" y="148" width="100" height="10" rx="5" fill="#E2E8F0" />
    <rect x="175" y="164" width="60" height="6" rx="3" fill="#EDF2F7" />
    
    <!-- Post Content Lines -->
    <rect x="125" y="205" width="250" height="12" rx="6" fill="#F1F5F9" />
    <rect x="125" y="227" width="250" height="12" rx="6" fill="#F1F5F9" />
    <rect x="125" y="249" width="180" height="12" rx="6" fill="#F1F5F9" />
    
    <!-- Interactive Bottom Actions -->
    <line x1="125" y1="290" x2="375" y2="290" stroke="#F1F5F9" stroke-width="2" />
    
    <!-- Heart Icon -->
    <path d="M140,320 C130,310 115,320 125,335 L140,350 L155,335 C165,320 150,310 140,320 Z" fill="#FF5A79" />
    <rect x="165" y="327" width="35" height="10" rx="5" fill="#E2E8F0" />

    <!-- Share Icon -->
    <path d="M345,320 L360,330 L345,340 Z" fill="#94A3B8" />
    <rect x="295" y="327" width="35" height="10" rx="5" fill="#E2E8F0" />
  </g>

  <!-- Floating Active "Comments" Bubble 1 (Aqua Theme) -->
  <g filter="url(#pop-shadow)" transform="translate(290, 80)">
    <rect x="0" y="0" width="160" height="65" rx="20" fill="url(#aquaGrad)" />
    <!-- Little speech indicator arrow -->
    <polygon points="30,64 45,64 35,78" fill="#00B0FF" />
    
    <!-- Comment text representation -->
    <circle cx="30" cy="32" r="12" fill="#FFFFFF" opacity="0.3" />
    <rect x="52" y="24" width="85" height="8" rx="4" fill="#FFFFFF" />
    <rect x="52" y="38" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Floating Active "Comments" Bubble 2 (Classic Blue Theme) -->
  <g filter="url(#drop-shadow)" transform="translate(50, 310)">
    <rect x="0" y="0" width="150" height="60" rx="18" fill="#FFFFFF" />
    <!-- Little speech indicator arrow -->
    <polygon points="110,0 120,0 115,-12" fill="#FFFFFF" />
    
    <!-- Comment text representation -->
    <circle cx="28" cy="30" r="10" fill="url(#blueGrad)" opacity="0.8" />
    <rect x="48" y="22" width="75" height="6" rx="3" fill="#E2E8F0" />
    <rect x="48" y="34" width="50" height="6" rx="3" fill="#EDF2F7" />
  </g>
</svg>
