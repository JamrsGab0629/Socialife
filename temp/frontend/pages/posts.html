<div class="card card--pad">
  <div class="toolbar">
    <div class="search-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="text-input" id="posts-search" placeholder="Search posts by author or content" />
    </div>
    <div class="select">
      <select id="posts-filter" class="select-input">
        <option value="all">All posts</option>
        <option value="active">Active</option>
        <option value="removed">Removed</option>
      </select>
    </div>
    <div class="toolbar__spacer"></div>
  </div>

  <div class="data-table-wrap" id="posts-table-wrap">
    <table class="data-table" id="posts-table">
      <thead>
        <tr><th>Author</th><th>Content</th><th>Created</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="posts-table-body"></tbody>
    </table>
  </div>

  <div id="posts-pagination"></div>
</div>
