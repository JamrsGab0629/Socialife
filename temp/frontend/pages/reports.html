<div class="card card--pad">
  <div class="toolbar">
    <div class="select">
      <select id="reports-status-filter" class="select-input">
        <option value="all">All statuses</option>
        <option value="pending">Pending</option>
        <option value="reviewed">Reviewed</option>
        <option value="resolved">Resolved</option>
        <option value="dismissed">Dismissed</option>
      </select>
    </div>
    <div class="toolbar__spacer"></div>
  </div>

  <div class="data-table-wrap" id="reports-table-wrap">
    <table class="data-table" id="reports-table">
      <thead>
        <tr><th>Reporter</th><th>Reported</th><th>Reason</th><th>Status</th><th>Date</th><th></th></tr>
      </thead>
      <tbody id="reports-table-body"></tbody>
    </table>
  </div>

  <div id="reports-pagination"></div>
</div>
