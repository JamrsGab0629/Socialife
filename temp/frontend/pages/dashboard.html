<div class="page-section">
  <div class="grid-metrics" id="metrics-grid"></div>
</div>

<div class="page-section">
  <div class="grid-charts">
    <div class="chart-card">
      <div class="chart-card__head">
        <span class="chart-card__title">User Growth</span>
        <div class="select"><select><option>This month</option><option>Last month</option></select></div>
      </div>
      <div class="chart-card__body"><svg id="user-growth-chart"></svg></div>
    </div>
    <div class="chart-card">
      <div class="chart-card__head">
        <span class="chart-card__title">Daily Active Users</span>
        <div class="select"><select><option>This week</option><option>Last week</option></select></div>
      </div>
      <div class="chart-card__body"><svg id="dau-chart"></svg></div>
    </div>
    <div class="chart-card">
      <div class="chart-card__head">
        <span class="chart-card__title">Peak Usage Hours</span>
        <div class="select"><select><option>Today</option><option>Yesterday</option></select></div>
      </div>
      <div class="chart-card__body"><svg id="peak-hours-chart"></svg></div>
    </div>
    <div class="chart-card">
      <div class="chart-card__head">
        <span class="chart-card__title">Monthly Activity</span>
        <div class="select"><select><option>This year</option><option>Last year</option></select></div>
      </div>
      <div class="chart-card__body"><svg id="monthly-activity-chart"></svg></div>
    </div>
  </div>
</div>

<div class="page-section">
  <div class="grid-split">
    <div class="card card--pad">
      <div class="page-section__head">
        <h2>Recent Reports</h2>
        <a class="link-btn" href="#/reports">View all</a>
      </div>
      <div id="recent-reports-list"></div>
    </div>

    <div class="card card--pad">
      <div class="page-section__head">
        <h2>Recent Users</h2>
        <a class="link-btn" href="#/users">View all</a>
      </div>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>User</th><th>Email</th><th>Joined</th><th>Status</th></tr>
          </thead>
          <tbody id="recent-users-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
